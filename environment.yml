name: gpu-minicourse
channels:
  - conda-forge
dependencies:
  # Python is held at 3.12 because TensorFlow is the slowest to support a new
  # release; it also holds PyTorch at 2.12. CUDA 13 solves, but the cluster
  # driver must be new enough (>=580) before the pin moves.
  # Drop TensorFlow to go higher.
  - python 3.12.*
  - cuda-version 12.9.*
  # GPU libraries. numba-cuda supplies numba.cuda; the CUDA target is no longer
  # part of numba itself.
  - cupy >=14
  - numba >=0.66
  - numba-cuda >=0.30
  - pytorch-gpu >=2.12
  - tensorflow-gpu >=2.21
  # Scientific stack
  - iminuit
  - matplotlib-base >=3.9
  - numpy >=2
  - scipy
  # Notebook environment
  - ipympl
  - ipywidgets
  - jupyterlab >=4
  - line_profiler
  - nb_conda_kernels
