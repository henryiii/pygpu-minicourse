name: gpu-minicourse
channels:
  - conda-forge
dependencies:
  # The CUDA pin follows the cluster driver (CUDA 13 needs driver >=580).
  - python 3.14.*
  - cuda-version 12.9.*
  # GPU libraries. numba-cuda supplies numba.cuda; the CUDA target is no longer
  # part of numba itself.
  - cupy >=14
  - numba >=0.66
  - numba-cuda >=0.30
  - pytorch-gpu >=2.14
  - jax >=0.9
  - jaxlib * *cuda*
  # Scientific stack
  - iminuit
  - matplotlib-base >=3.9
  - numpy >=2
  - scipy
  # Notebook environment
  - ipympl
  - ipywidgets
  - jupyterlab >=4
  - line_profiler
  - nb_conda_kernels
